name: "Release pipeline"

# Tag-triggered full pipeline. The graph is:
#
#   tag refs/tags/v* (or manual dispatch)
#     └── host_tests          (gate: regression suite must pass)
#           └── webui_and_lfs (one WebUI build, three sized storage.bin)
#                 └── firmware (matrix: rev-a, rev-a-29, rev-b, v8)
#                       └── release (collects artifacts, publishes tag)
#
# On non-tag pushes this file does nothing — host_tests.yaml is the
# push-time regression guard. The release pipeline is intentionally
# heavy (IDF toolchain + WebUI + matrix) and only runs when we're
# actually shipping.
#
# Adding a new hardware variant is a single entry in the `variants`
# matrix include-list below: pick a label, wire it to a BTCLOCK_BOARD
# value, give it its sdkconfig suffix, and point it at one of the
# three storage sizes. No other job needs to change.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 1. Host tests preflight
  # ---------------------------------------------------------------
  # Duplicates host_tests.yaml's job body on purpose: Forgejo Actions
  # has no cross-workflow `needs:`, so to gate the release chain on
  # the host-test suite we re-run it here. The standalone
  # host_tests.yaml still runs on every push/PR — that's the fast
  # regression signal — and this copy guarantees the release pipeline
  # can't bypass it.
  host_tests:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake

      - name: Configure
        shell: bash
        run: cmake -S test_host -B build-host

      - name: Build
        shell: bash
        run: cmake --build build-host --parallel

      - name: Run
        shell: bash
        run: ./build-host/btclock_host_tests

  # ---------------------------------------------------------------
  # 2. WebUI + LittleFS images (built once, shared across variants)
  # ---------------------------------------------------------------
  # Previously every firmware variant re-ran `pnpm install && pnpm
  # build && gzip_build.py && littlefs-python create` — three times
  # the same work for identical output. This job builds the WebUI
  # exactly once, packs one storage.bin per supported flash size, and
  # publishes them as artifacts for the firmware matrix to consume.
  #
  # The output artifact names are keyed on storage size (4mb / 8mb /
  # 16mb), not on variant label — this is what lets the `rev-a-29`
  # entry share Rev A's 4 MB image for free.
  webui_and_lfs:
    runs-on: docker
    container:
      image: espressif/idf:release-v6.0
    needs: host_tests
    steps:
      - name: Install Node.js (for JS-based Forgejo actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: data/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: data/pnpm-lock.yaml

      - name: Build WebUI
        shell: bash
        working-directory: data
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          python3 gzip_build.py

      - name: Install littlefs-python
        shell: bash
        # Pinned to match local dev machines so CI output is
        # byte-identical to `idf.py flash`. The espressif/idf image's
        # pip lives inside its managed venv — sourcing export.sh puts
        # it on PATH.
        run: |
          . /opt/esp/idf/export.sh
          pip install littlefs-python==0.15.0

      - name: Pack storage images (all variant sizes)
        shell: bash
        # Three sizes cover every current and planned variant:
        #   4mb  -> 0x67000   (REV_A, REV_A_29)
        #   8mb  -> 0xCD000   (REV_B)
        #   16mb -> 0x200000  (V8)
        # Block/page/name-max match the on-device littlefs config
        # (joltwallet__littlefs 1.21.1 / LittleFS v2.11.1).
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p dist-lfs
          for entry in "4mb:421888" "8mb:839680" "16mb:2097152"; do
            label="${entry%%:*}"
            size="${entry##*:}"
            littlefs-python create \
              data/build_gz \
              "dist-lfs/storage-${label}.bin" \
              -v \
              --fs-size="${size}" \
              --name-max=64 \
              --block-size=4096
          done
          ls -la dist-lfs

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: lfs-storage-images
          path: dist-lfs/*.bin
          retention-days: 14
          include-hidden-files: false

  # ---------------------------------------------------------------
  # 3. Firmware matrix
  # ---------------------------------------------------------------
  # One row per hardware variant.
  #
  # Every column here is driven off the matrix row: sdkconfig dir,
  # BTCLOCK_BOARD, storage size label, partition offset. No variant-
  # specific shell branching in the steps.
  firmware:
    runs-on: docker
    container:
      image: espressif/idf:release-v6.0
    needs: webui_and_lfs
    permissions:
      contents: write
    strategy:
      # Keep the whole matrix reporting even if one variant breaks —
      # otherwise a Rev A compile error starves Rev B / V8 of signal.
      fail-fast: false
      matrix:
        include:
          - variant_label: rev-a
            btclock_board: REV_A
            btclock_panel: "2_13"
            sdkconfig_dir: build-rev-a
            lfs_size_label: 4mb
            partition_offset: "0x370000"
          # 2.9" EPD Rev A. Same MCU + 4 MB flash as Rev A, so it
          # shares the 4mb storage image; only the EPD geometry
          # differs (BTCLOCK_PANEL=2_9 keys the orthogonal panel
          # selector that the EPD driver factory consumes).
          - variant_label: rev-a-29
            btclock_board: REV_A
            btclock_panel: "2_9"
            sdkconfig_dir: build-rev-a-29
            lfs_size_label: 4mb
            partition_offset: "0x370000"
          - variant_label: rev-b
            btclock_board: REV_B
            btclock_panel: "2_13"
            sdkconfig_dir: build-rev-b
            lfs_size_label: 8mb
            partition_offset: "0x6F0000"
          - variant_label: v8
            btclock_board: V8
            btclock_panel: "2_13"
            sdkconfig_dir: build-v8
            lfs_size_label: 16mb
            partition_offset: "0xDF0000"
    steps:
      - name: Install Node.js (for JS-based Forgejo actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs

      # ccache shrinks cache-miss rebuilds (sdkconfig touched but
      # source unchanged) from ~10 min/variant to a link + a few
      # recompiles. ESP-IDF picks it up via IDF_CCACHE_ENABLE=1 below.
      - name: Install ccache
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Short SHA
        id: vars
        shell: bash
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Cache ESP-IDF managed_components + per-variant build dir.
      # Key reflects the inputs that actually change the build:
      # dependency versions and sdkconfig fragments.
      - uses: actions/cache@v5
        with:
          path: |
            managed_components
            ${{ matrix.sdkconfig_dir }}
          key: idf-v6.0-${{ matrix.variant_label }}-${{ hashFiles('dependencies.lock', 'sdkconfig.defaults', format('sdkconfig.defaults.{0}', matrix.btclock_board)) }}
          restore-keys: |
            idf-v6.0-${{ matrix.variant_label }}-

      # Independent ccache cache: the SHA-keyed primary write means
      # each commit gets a fresh save, while the prefix-keyed restore
      # keys let a miss fall back to the most recent variant cache
      # (and then to any variant's cache as a last resort). Kept
      # separate from the build-dir cache above so a miss on one key
      # doesn't blow away the other.
      #
      # Path is the literal CCACHE_DIR (see build step env below). We
      # don't use ~/.ccache here because actions/cache expands `~` at
      # the runner side, which may not match the in-container HOME for
      # the espressif/idf image — pin both ends to the same absolute
      # path and there's no ambiguity.
      - uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-idf-v6.0-${{ matrix.variant_label }}-${{ github.sha }}
          restore-keys: |
            ccache-idf-v6.0-${{ matrix.variant_label }}-
            ccache-idf-v6.0-

      - name: Download prebuilt LFS images
        uses: https://code.forgejo.org/forgejo/download-artifact@v7
        with:
          name: lfs-storage-images
          path: dist-lfs

      - name: Configure + build firmware
        shell: bash
        # The espressif/idf container's entrypoint sources export.sh
        # but `shell: bash` bypasses the entrypoint, so source it
        # explicitly here.
        #
        # IDF_CCACHE_ENABLE is read by ESP-IDF at cmake-configure time,
        # so it has to be in the step's `env:` block, not just exported
        # in the script body. CCACHE_DIR is pinned to a literal absolute
        # path (the espressif/idf image runs as root, so $HOME is
        # /root) so it matches the actions/cache `path:` exactly.
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: /root/.ccache
        run: |
          . /opt/esp/idf/export.sh
          # Cap before the build so the limit applies to writes from
          # this run, not just the next one.
          ccache -M 2G
          idf.py \
            -B "${{ matrix.sdkconfig_dir }}" \
            -D BTCLOCK_BOARD=${{ matrix.btclock_board }} \
            -D BTCLOCK_PANEL=${{ matrix.btclock_panel }} \
            -D SDKCONFIG="${{ matrix.sdkconfig_dir }}/sdkconfig" \
            build

      # Surface hit/miss rates in the CI log so we can see whether the
      # cache is actually warming across runs. First run reports ~0%;
      # second run on unchanged source should be ~95%+.
      - name: ccache stats
        if: always()
        shell: bash
        env:
          CCACHE_DIR: /root/.ccache
        run: ccache -s

      - name: Stage artifacts
        shell: bash
        # Flat per-variant directory with everything a flasher needs,
        # plus the pre-packed LittleFS image picked by size label.
        run: |
          out="dist-ci/btclock_v4-${{ matrix.variant_label }}-${{ steps.vars.outputs.short_sha }}"
          mkdir -p "$out"
          cp "${{ matrix.sdkconfig_dir }}/btclock_v4.bin"                     "$out/"
          cp "${{ matrix.sdkconfig_dir }}/bootloader/bootloader.bin"          "$out/"
          cp "${{ matrix.sdkconfig_dir }}/partition_table/partition-table.bin" "$out/"
          cp "${{ matrix.sdkconfig_dir }}/ota_data_initial.bin"               "$out/"
          cp "${{ matrix.sdkconfig_dir }}/flash_args"                         "$out/" || true
          cp "dist-lfs/storage-${{ matrix.lfs_size_label }}.bin"              "$out/storage.bin"
          # SHA-256 of the app binary for OTA integrity checks.
          ( cd "$out" && sha256sum btclock_v4.bin > btclock_v4.bin.sha256 )

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: btclock_v4-${{ matrix.variant_label }}-${{ steps.vars.outputs.short_sha }}
          path: dist-ci/btclock_v4-${{ matrix.variant_label }}-${{ steps.vars.outputs.short_sha }}/**
          retention-days: 14
          include-hidden-files: false

  # ---------------------------------------------------------------
  # 4. Release publication (tag pushes only)
  # ---------------------------------------------------------------
  # Collects every per-variant artifact and attaches flat `.bin` +
  # `.sha256` files to a Forgejo release at the pushed tag. The naming
  # scheme matches what `MakeOtaConfig()` in init_control_api.cpp
  # selects, so /api/firmware/auto_update can fetch the right asset
  # via the gitReleaseUrl pref.
  release:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    needs: firmware
    permissions:
      contents: write
    steps:
      - name: Install tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl jq coreutils

      - uses: https://code.forgejo.org/forgejo/download-artifact@v7
        with:
          pattern: btclock_v4-*
          merge-multiple: false
          path: incoming

      - name: Stage release assets (bin, deduped)
        shell: bash
        # Per-variant output: only the firmware app binary truly differs
        # per variant — rename it to btclock_<variant>_ota.bin so the
        # on-device auto-update fetcher can find it via the
        # gitReleaseUrl pref. Everything else (bootloader, partition
        # table, LittleFS storage image, blank OTA state) is dedup-keyed
        # by sha256: the first occurrence wins under a stable name
        # ("<base>_<size>.bin" for the flash-size-keyed images, plain
        # "<base>.bin" for files that hash identically across all
        # variants — typically ota_data_initial.bin). sha256 sidecars
        # use sha256sum's default `<hex>  <name>` line so verifiers
        # know which file the digest belongs to (the v3 release feed
        # sometimes shipped just the bare hex).
        run: |
          set -euo pipefail
          mkdir -p release

          declare -A SIZE_FOR_VARIANT=(
            [rev-a]=4mb [rev-a-29]=4mb [rev-b]=8mb [v8]=16mb
          )
          declare -A SEEN_HASH

          for d in incoming/btclock_v4-*; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            # Pattern: btclock_v4-<variant>-<sha>; <variant> may contain
            # dashes (rev-a, rev-a-29) so strip only the trailing sha.
            variant="${name#btclock_v4-}"
            variant="${variant%-*}"
            variant_us="${variant//-/_}"
            size="${SIZE_FOR_VARIANT[$variant]:-unknown}"

            # 1. Variant-unique app binary.
            if [ -f "$d/btclock_v4.bin" ]; then
              cp "$d/btclock_v4.bin" "release/btclock_${variant_us}_ota.bin"
            fi

            # 2. Shared-by-flash-size or fully-shared support bins,
            #    sha256-deduped so identical content uploads once.
            for fname in bootloader partition-table storage ota_data_initial; do
              src="$d/${fname}.bin"
              [ -f "$src" ] || continue
              h=$(sha256sum "$src" | awk '{print $1}')
              if [ -z "${SEEN_HASH[$h]:-}" ]; then
                if [ "$fname" = "ota_data_initial" ]; then
                  out="ota_data_initial.bin"
                else
                  out="${fname}_${size}.bin"
                fi
                cp "$src" "release/${out}"
                SEEN_HASH[$h]="$out"
              fi
            done
          done

          # sha256 sidecars in the format `<hex>  <name>` so e.g.
          # `sha256sum -c btclock_rev_b_ota.bin.sha256` works.
          ( cd release
            for f in *.bin; do
              sha256sum "$f" > "${f}.sha256"
            done
          )
          ls -la release

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: release-${{ github.ref_name }}
          path: release/*
          retention-days: 90

      - name: Create Forgejo release and attach assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        # Forgejo exposes the Gitea-compatible release API. GITHUB_TOKEN
        # is auto-injected by the runner with repo write scope for this
        # workflow; no extra secret needed. If the release already
        # exists (e.g. a re-run), we reuse its id and just upload the
        # assets.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="${SERVER}/api/v1/repos/${REPO}/releases"
          auth="Authorization: token ${GH_TOKEN}"

          # Look up an existing release for this tag, else create it.
          existing="$(curl -sSL -H "$auth" "${api}/tags/${TAG}" || true)"
          rel_id="$(echo "$existing" | jq -r '.id // empty')"
          if [ -z "$rel_id" ]; then
            rel_id="$(curl -sSL -X POST -H "$auth" -H "Content-Type: application/json" \
              -d "$(jq -n --arg tag "$TAG" \
                    '{tag_name:$tag, name:$tag, draft:false, prerelease:false}')" \
              "$api" | jq -r '.id')"
          fi
          echo "release id: $rel_id"

          for f in release/*.bin release/*.sha256; do
            [ -f "$f" ] || continue
            echo "uploading $f"
            curl -sSL -X POST -H "$auth" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "${api}/${rel_id}/assets?name=$(basename "$f")"
          done
