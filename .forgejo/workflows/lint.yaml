name: "Lint"

# Style + static-analysis gate. Runs alongside host_tests on every push
# and PR. Two jobs, both gating:
#   - format: clang-format dry-run over components/ main/ test_host/
#   - tidy:   clang-tidy on host-test sources (the only TU set with a
#             tractable include graph — IDF / mbedTLS / FreeRTOS would
#             otherwise drown the report). All configured checks are
#             promoted to errors (`WarningsAsErrors: '*'`).

on:
  push:
    branches:
      - main
    # clang-format / clang-tidy only scan C++ under components/ main/
    # test_host/, so skip the gate when a push changes none of that —
    # i.e. only the data/ submodule pin, documentation, or the CI
    # workflow files themselves. `paths-ignore` skips a run only when
    # EVERY changed path matches, so any accompanying source edit still
    # triggers both jobs. Lint tooling/config (tools/lint/**,
    # .clang-format, .clang-tidy) is intentionally NOT ignored — changing
    # it must re-run the gate.
    paths-ignore:
      - "data"
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs-requirements.txt"
      - ".forgejo/workflows/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "data"
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "mkdocs.yml"
      - "mkdocs-requirements.txt"
      - ".forgejo/workflows/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  format:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      # Pin to a specific LLVM major. clang-format's output drifts
      # between majors (notably 18 → 19 → 20 changed `IncludeBlocks`
      # heuristics), so CI and `brew install llvm` must agree on the
      # version or the gate flaps.
      CLANG_VERSION: "22"
      CLANG_FORMAT: clang-format-22
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install clang-format-${{ env.CLANG_VERSION }}
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget gnupg lsb-release software-properties-common ca-certificates
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${CLANG_VERSION} main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            "clang-format-${CLANG_VERSION}"

      - name: Verify formatting
        shell: bash
        run: tools/lint/format.sh --check

  tidy:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      CLANG_VERSION: "22"
      CLANG_TIDY: clang-tidy-22
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools + clang-tidy-${{ env.CLANG_VERSION }}
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            wget gnupg lsb-release software-properties-common ca-certificates \
            build-essential cmake
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-${CLANG_VERSION} main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y --no-install-recommends \
            "clang-tidy-${CLANG_VERSION}" "clang-${CLANG_VERSION}"

      - name: Configure host build with compile_commands.json
        shell: bash
        run: cmake -S test_host -B build-host -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        shell: bash
        run: tools/lint/tidy.sh
