name: "Host tests"

# Pure-logic unit tests (test_host/) run on every push and PR.
# No ESP-IDF toolchain needed — just gcc + cmake.

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  host_tests:
    runs-on: docker
    container:
      # catthehacker's js-24.04 ships Node + Python + git + basic build
      # tools, which JS-based actions (actions/checkout, actions/cache)
      # require. The slimmer debian:stable-slim image was failing on
      # checkout with "node: executable file not found in $PATH".
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      # CMake compiler launcher path — pinned to a literal absolute dir
      # so the actions/cache `path:` matches the in-container HOME (the
      # job runs as root, and ~ expansion happens runner-side, not
      # container-side).
      CCACHE_DIR: /root/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          # Host tests don't consume the webui submodule, but recursive
          # keeps the checkout graph consistent with the firmware job.
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          # cmake is present in the base image but pin the install step
          # so the workflow stays self-documenting if the base image ever
          # stops shipping it. ninja-build + ccache: ninja's dep graph
          # parallelises tighter than make on cold builds; ccache turns
          # unchanged-source repushes into ~1-minute relinks instead of
          # full ~10-minute recompiles.
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      - uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-host-tests-${{ github.sha }}
          restore-keys: |
            ccache-host-tests-

      - name: Configure
        shell: bash
        run: |
          ccache -M 500M
          cmake -S test_host -B build-host -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: cmake --build build-host --parallel

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s

      - name: Run
        shell: bash
        run: ./build-host/btclock_host_tests

  sanitize:
    # ASan + UBSan catch use-after-free, OOB reads, signed overflow, and
    # misaligned loads that boot fine on macOS local but misbehave on the
    # ESP32-S3. Gates the merge — sanitizer reports indicate real bugs.
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      CCACHE_DIR: /root/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      # Sanitizer build ships its own cache slot — ccache keys
      # incorporate compile flags, so an ASan/UBSan build won't share
      # objects with the vanilla `host_tests` job. Each job gets its
      # own cache entry; no cross-pollution.
      - uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-host-tests-san-${{ github.sha }}
          restore-keys: |
            ccache-host-tests-san-

      - name: Configure
        shell: bash
        run: |
          ccache -M 500M
          cmake -S test_host -B build-host-san -G Ninja \
            -DBTCLOCK_HOST_TESTS_SANITIZE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: cmake --build build-host-san --parallel

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s

      - name: Run
        shell: bash
        env:
          # halt_on_error makes the binary exit non-zero on the first
          # report so the job fails fast.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-host-san/btclock_host_tests

  coverage:
    # Informational gcov + gcovr report. Not gating today — file a
    # follow-up to add a fail-on-drop threshold once the baseline is known.
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    env:
      CCACHE_DIR: /root/.ccache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache gcovr

      - uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-host-tests-cov-${{ github.sha }}
          restore-keys: |
            ccache-host-tests-cov-

      - name: Configure
        shell: bash
        run: |
          ccache -M 500M
          cmake -S test_host -B build-host-cov -G Ninja \
            -DBTCLOCK_HOST_TESTS_COVERAGE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: cmake --build build-host-cov --parallel

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s

      - name: Run
        shell: bash
        run: ./build-host-cov/btclock_host_tests

      - name: Generate coverage report
        shell: bash
        run: |
          gcovr --root . \
            --filter 'components/' --filter 'main/' \
            --exclude 'test_host/' --exclude '.*vendor/' \
            --html-details build-host-cov/coverage.html \
            --txt --print-summary \
            --output build-host-cov/coverage.txt \
            build-host-cov/

      - name: Print coverage summary
        shell: bash
        run: cat build-host-cov/coverage.txt

      - name: Upload coverage artifact
        # Forgejo's runner is GHES-incompatible for actions/upload-artifact
        # (the @actions/artifact v2 protocol). Use the Forgejo fork —
        # release.yaml uses the same.
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: host-tests-coverage
          path: build-host-cov/coverage*.html
          retention-days: 14
          include-hidden-files: false
