name: "Host tests"

# Pure-logic unit tests (test_host/) run on every push and PR.
# No ESP-IDF toolchain needed — just gcc + cmake.

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  host_tests:
    runs-on: docker
    container:
      # catthehacker's js-24.04 ships Node + Python + git + basic build
      # tools, which JS-based actions (actions/checkout, actions/cache)
      # require. The slimmer debian:stable-slim image was failing on
      # checkout with "node: executable file not found in $PATH".
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # Host tests don't consume the webui submodule, but recursive
          # keeps the checkout graph consistent with the firmware job.
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          # cmake is present in the base image but pin the install step
          # so the workflow stays self-documenting if the base image ever
          # stops shipping it.
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake

      - name: Configure
        shell: bash
        run: cmake -S test_host -B build-host

      - name: Build
        shell: bash
        run: cmake --build build-host --parallel

      - name: Run
        shell: bash
        run: ./build-host/btclock_host_tests

  sanitize:
    # ASan + UBSan catch use-after-free, OOB reads, signed overflow, and
    # misaligned loads that boot fine on macOS local but misbehave on the
    # ESP32-S3. Gates the merge — sanitizer reports indicate real bugs.
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake

      - name: Configure
        shell: bash
        run: cmake -S test_host -B build-host-san -DBTCLOCK_HOST_TESTS_SANITIZE=ON

      - name: Build
        shell: bash
        run: cmake --build build-host-san --parallel

      - name: Run
        shell: bash
        env:
          # halt_on_error makes the binary exit non-zero on the first
          # report so the job fails fast.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-host-san/btclock_host_tests

  coverage:
    # Informational gcov + gcovr report. Not gating today — file a
    # follow-up to add a fail-on-drop threshold once the baseline is known.
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:js-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake gcovr

      - name: Configure
        shell: bash
        run: cmake -S test_host -B build-host-cov -DBTCLOCK_HOST_TESTS_COVERAGE=ON

      - name: Build
        shell: bash
        run: cmake --build build-host-cov --parallel

      - name: Run
        shell: bash
        run: ./build-host-cov/btclock_host_tests

      - name: Generate coverage report
        shell: bash
        run: |
          gcovr --root . \
            --filter 'components/' --filter 'main/' \
            --exclude 'test_host/' --exclude '.*vendor/' \
            --html-details build-host-cov/coverage.html \
            --txt --print-summary \
            --output build-host-cov/coverage.txt \
            build-host-cov/

      - name: Print coverage summary
        shell: bash
        run: cat build-host-cov/coverage.txt

      - name: Upload coverage artifact
        # Forgejo's runner is GHES-incompatible for actions/upload-artifact
        # (the @actions/artifact v2 protocol). Use the Forgejo fork —
        # release.yaml uses the same.
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: host-tests-coverage
          path: build-host-cov/coverage*.html
          retention-days: 14
          include-hidden-files: false
