name: "Release pipeline"

# GitHub Actions twin of .forgejo/workflows/release.yaml. Forgejo CI is
# canonical — keep both in sync.
#
# Tag-triggered full pipeline. The graph is:
#
#   tag refs/tags/[0-9]* (or manual dispatch)
#     └── host_tests          (gate: regression suite must pass)
#           └── webui_and_lfs (one WebUI build, three sized storage.bin)
#                 └── firmware (matrix: rev-a, rev-a-29, rev-b, v8)
#                       └── release (collects artifacts, publishes tag)
#
# Differences vs the Forgejo file (intentional, minimum-set):
#   - `runs-on: docker` + `container: ghcr.io/catthehacker/ubuntu:...`
#     replaced with `runs-on: ubuntu-latest` (the upstream image is
#     designed for the catthehacker self-hosted runner; GitHub ships
#     everything we need in ubuntu-latest natively).
#   - `actions/{cache,checkout,setup-node,upload-artifact,download-
#     artifact}` use their canonical github.com/actions namespace at
#     the latest Node.js 24 major (cache@v5, checkout@v6, setup-node@v6,
#     setup-python@v6, upload-artifact@v7, download-artifact@v8,
#     pnpm/action-setup@v6) instead of the Forgejo-fork aliases.
#   - Release publication uses ncipollo/release-action@v1 instead of
#     the Forgejo Gitea release REST API (different endpoint shape).
#     Same action the proven-working v3 GitHub CI uses.
#   - CCACHE_DIR points at /home/runner/.ccache outside containers and
#     /root/.ccache inside the espressif/idf:v6.0.1 container (runs as
#     root).

on:
  push:
    tags:
      # Semver-shaped tags only — `4.0.0`, `4.1.0-beta.2`, etc. Bare
      # digit prefix (no `v`) matches what `git describe --match
      # "[0-9]*"` surfaces as PROJECT_VER. Tags like `nightly` /
      # `snapshot` intentionally don't trigger the heavy release path.
      - "[0-9]*"
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # 1. Host tests preflight
  # ---------------------------------------------------------------
  # Duplicates host_tests.yml's job body on purpose: Actions has no
  # cross-workflow `needs:`, so to gate the release chain on the
  # host-test suite we re-run it here.
  host_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Configure
        shell: bash
        run: cmake -S test_host -B build-host

      - name: Build
        shell: bash
        run: cmake --build build-host --parallel

      - name: Run
        shell: bash
        run: ./build-host/btclock_host_tests

  # ---------------------------------------------------------------
  # 2. WebUI + LittleFS images (built once, shared across variants)
  # ---------------------------------------------------------------
  # Output artifact names are keyed on storage size (4mb / 8mb /
  # 16mb), not on variant label — this lets the `rev-a-29` entry
  # share Rev A's 4 MB image for free.
  webui_and_lfs:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    needs: host_tests
    steps:
      - name: Install Node.js (for JS-based actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: data/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: data/pnpm-lock.yaml

      - name: Build WebUI
        shell: bash
        working-directory: data
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          python3 gzip_build.py

      - name: Install littlefs-python
        shell: bash
        # Pinned. The wrapper version only matters for CLI ergonomics;
        # disk-format compatibility is set by the bundled LittleFS C
        # core. 0.17.1 ships the same LittleFS v2.11.2 (commit
        # adad0fb) as 0.15.0 did, so CI output stays byte-identical to
        # `idf.py flash` while picking up upstream bugfixes (symlink
        # globbing in `create`, REPL fixes). The espressif/idf image's
        # pip lives inside its managed venv — sourcing export.sh puts
        # it on PATH.
        run: |
          . /opt/esp/idf/export.sh
          pip install littlefs-python==0.17.1

      - name: Pack storage images (all variant sizes)
        shell: bash
        # Three sizes cover every current and planned variant:
        #   4mb  -> 0x67000   (REV_A, REV_A_29)
        #   8mb  -> 0xCD000   (REV_B)
        #   16mb -> 0x200000  (V8)
        # Block/page/name-max match the on-device littlefs config
        # (joltwallet__littlefs / LittleFS v2.11.x).
        run: |
          . /opt/esp/idf/export.sh
          mkdir -p dist-lfs
          for entry in "4mb:421888" "8mb:839680" "16mb:2097152"; do
            label="${entry%%:*}"
            size="${entry##*:}"
            littlefs-python create \
              data/build_gz \
              "dist-lfs/storage-${label}.bin" \
              -v \
              --fs-size="${size}" \
              --name-max=64 \
              --block-size=4096
          done
          ls -la dist-lfs

      - uses: actions/upload-artifact@v7
        with:
          name: lfs-storage-images
          path: dist-lfs/*.bin
          retention-days: 14
          include-hidden-files: false

  # ---------------------------------------------------------------
  # 3. Firmware matrix
  # ---------------------------------------------------------------
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    needs: webui_and_lfs
    permissions:
      contents: write
    strategy:
      # Keep the whole matrix reporting even if one variant breaks —
      # otherwise a Rev A compile error starves Rev B / V8 of signal.
      fail-fast: false
      matrix:
        include:
          - variant_label: rev-a
            btclock_board: REV_A
            btclock_panel: "2_13"
            sdkconfig_dir: build-rev-a
            lfs_size_label: 4mb
            partition_offset: "0x370000"
          # 2.9" EPD Rev A. Shares the 4mb storage image; only the EPD
          # geometry differs (BTCLOCK_PANEL=2_9 keys the orthogonal
          # panel selector the EPD driver factory consumes).
          - variant_label: rev-a-29
            btclock_board: REV_A
            btclock_panel: "2_9"
            sdkconfig_dir: build-rev-a-29
            lfs_size_label: 4mb
            partition_offset: "0x370000"
          - variant_label: rev-b
            btclock_board: REV_B
            btclock_panel: "2_13"
            sdkconfig_dir: build-rev-b
            lfs_size_label: 8mb
            partition_offset: "0x6F0000"
          - variant_label: v8
            btclock_board: V8
            btclock_panel: "2_13"
            sdkconfig_dir: build-v8
            lfs_size_label: 16mb
            partition_offset: "0xDF0000"
    steps:
      - name: Install Node.js (for JS-based actions)
        shell: bash
        run: |
          apt-get update
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y --no-install-recommends nodejs

      # ccache shrinks cache-miss rebuilds (sdkconfig touched but
      # source unchanged) from ~10 min/variant to a link + a few
      # recompiles. ESP-IDF picks it up via IDF_CCACHE_ENABLE=1 below.
      - name: Install ccache + jq
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ccache jq

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # GitHub mounts the workspace as the host runner user (UID 1001)
      # but the espressif/idf:v6.0.1 container runs as root (UID 0).
      # actions/checkout sets safe.directory for its own git calls, but
      # the value doesn't persist for the bash steps below. Without
      # this, `git rev-parse --short HEAD` in the next step fails
      # silently inside `$(...)` (leaving short_sha empty), and the
      # later manifest step exits 128 on `detected dubious ownership`.
      # Forgejo's runner avoids the UID mismatch so its release.yaml
      # doesn't need this step.
      - name: Trust workspace ownership (container ↔ runner UID mismatch)
        shell: bash
        run: git config --global --add safe.directory '*'

      - name: Short SHA
        id: vars
        shell: bash
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Cache ESP-IDF managed_components + per-variant build dir.
      # Key reflects the inputs that actually change the build:
      # dependency versions and sdkconfig fragments.
      - uses: actions/cache@v5
        with:
          path: |
            managed_components
            ${{ matrix.sdkconfig_dir }}
          key: idf-v6.0-${{ matrix.variant_label }}-${{ hashFiles('dependencies.lock', 'sdkconfig.defaults', format('sdkconfig.defaults.{0}', matrix.btclock_board)) }}
          restore-keys: |
            idf-v6.0-${{ matrix.variant_label }}-

      # Independent ccache cache: the SHA-keyed primary write means
      # each commit gets a fresh save, while the prefix-keyed restore
      # keys let a miss fall back to the most recent variant cache
      # (and then to any variant's cache as a last resort). The
      # espressif/idf container runs as root, so CCACHE_DIR is
      # /root/.ccache.
      - uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-idf-v6.0-${{ matrix.variant_label }}-${{ github.sha }}
          restore-keys: |
            ccache-idf-v6.0-${{ matrix.variant_label }}-
            ccache-idf-v6.0-

      - name: Download prebuilt LFS images
        uses: actions/download-artifact@v8
        with:
          name: lfs-storage-images
          path: dist-lfs

      # Apply project-local patches to the IDF tree before building.
      # Each patch fixes an upstream bug we hit in production but
      # isn't yet released. Catalog + removal-criteria live in
      # tools/idf-patches/README.md. The script is idempotent so
      # cache-restored builds re-run it harmlessly.
      - name: Apply IDF patches
        shell: bash
        env:
          IDF_PATH: /opt/esp/idf
        run: tools/idf-patches/apply.sh

      - name: Configure + build firmware
        shell: bash
        # IDF_CCACHE_ENABLE is read by ESP-IDF at cmake-configure time,
        # so it has to be in the step's `env:` block, not just exported
        # in the script body. CCACHE_DIR is pinned to /root/.ccache —
        # see the actions/cache `path:` above.
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: /root/.ccache
        run: |
          . /opt/esp/idf/export.sh
          ccache -M 2G
          idf.py \
            -B "${{ matrix.sdkconfig_dir }}" \
            -D BTCLOCK_BOARD=${{ matrix.btclock_board }} \
            -D BTCLOCK_PANEL=${{ matrix.btclock_panel }} \
            -D SDKCONFIG="${{ matrix.sdkconfig_dir }}/sdkconfig" \
            build

      - name: ccache stats
        if: always()
        shell: bash
        env:
          CCACHE_DIR: /root/.ccache
        run: ccache -s

      - name: Stage artifacts
        shell: bash
        # Flat per-variant directory with everything a flasher needs,
        # plus the pre-packed LittleFS image picked by size label.
        run: |
          out="dist-ci/btclock_v4-${{ matrix.variant_label }}-${{ steps.vars.outputs.short_sha }}"
          mkdir -p "$out"
          cp "${{ matrix.sdkconfig_dir }}/btclock_v4.bin"                     "$out/"
          cp "${{ matrix.sdkconfig_dir }}/bootloader/bootloader.bin"          "$out/"
          cp "${{ matrix.sdkconfig_dir }}/partition_table/partition-table.bin" "$out/"
          cp "${{ matrix.sdkconfig_dir }}/ota_data_initial.bin"               "$out/"
          cp "${{ matrix.sdkconfig_dir }}/flash_args"                         "$out/" || true
          cp "dist-lfs/storage-${{ matrix.lfs_size_label }}.bin"              "$out/storage.bin"
          ( cd "$out" && sha256sum btclock_v4.bin > btclock_v4.bin.sha256 )

      - name: Generate variant manifest fragment
        shell: bash
        env:
          IDF_PATH: /opt/esp/idf
        run: |
          set -euo pipefail
          out="dist-ci/btclock_v4-${{ matrix.variant_label }}-${{ steps.vars.outputs.short_sha }}"
          webui_sha="$(git -C data rev-parse HEAD 2>/dev/null || echo '')"
          firmware_sha="$(git rev-parse HEAD)"
          firmware_version="$(git describe --tags --always --dirty --match '[0-9]*' 2>/dev/null || git rev-parse --short HEAD)"
          . "$IDF_PATH/export.sh" >/dev/null
          idf_version="$(idf.py --version 2>&1 | tail -n1)"
          fw_sha256="$(awk '{print $1}' "$out/btclock_v4.bin.sha256")"
          fw_md5="$(md5sum "$out/btclock_v4.bin" | awk '{print $1}')"
          storage_sha256="$(sha256sum "$out/storage.bin" | awk '{print $1}')"
          storage_md5="$(md5sum "$out/storage.bin" | awk '{print $1}')"
          jq -n \
            --arg variant         '${{ matrix.variant_label }}' \
            --arg board           '${{ matrix.btclock_board }}' \
            --arg panel           '${{ matrix.btclock_panel }}' \
            --arg flash_label     '${{ matrix.lfs_size_label }}' \
            --arg storage_offset  '${{ matrix.partition_offset }}' \
            --arg firmware_sha    "$firmware_sha" \
            --arg firmware_version "$firmware_version" \
            --arg webui_sha       "$webui_sha" \
            --arg idf_version     "$idf_version" \
            --arg fw_sha256       "$fw_sha256" \
            --arg fw_md5          "$fw_md5" \
            --arg storage_sha256  "$storage_sha256" \
            --arg storage_md5     "$storage_md5" \
            --arg built_at        "$(date -u +%FT%TZ)" \
            '{variant: $variant, board: $board, panel: $panel,
              flash_label: $flash_label, storage_offset: $storage_offset,
              firmware_sha: $firmware_sha,
              firmware_version: $firmware_version,
              webui_sha: $webui_sha, idf_version: $idf_version,
              firmware_sha256: $fw_sha256,
              firmware_md5: $fw_md5,
              storage_sha256: $storage_sha256,
              storage_md5: $storage_md5, built_at: $built_at}' \
            > "$out/manifest-fragment.json"
          cat "$out/manifest-fragment.json"

      - uses: actions/upload-artifact@v7
        with:
          name: btclock_v4-${{ matrix.variant_label }}-${{ steps.vars.outputs.short_sha }}
          path: dist-ci/btclock_v4-${{ matrix.variant_label }}-${{ steps.vars.outputs.short_sha }}/**
          retention-days: 14
          include-hidden-files: false

  # ---------------------------------------------------------------
  # 4. Release publication (tag pushes only)
  # ---------------------------------------------------------------
  # Collects every per-variant artifact and attaches flat `.bin` +
  # `.sha256` files to a GitHub release at the pushed tag. The naming
  # scheme matches what `MakeOtaConfig()` in init_control_api.cpp
  # selects, so /api/firmware/auto_update can fetch the right asset
  # via the gitReleaseUrl pref.
  release:
    runs-on: ubuntu-latest
    needs: firmware
    permissions:
      contents: write
    steps:
      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq coreutils

      - uses: actions/download-artifact@v8
        with:
          pattern: btclock_v4-*
          merge-multiple: false
          path: incoming

      - name: Stage release assets (bin, deduped)
        shell: bash
        # See the Forgejo file for the long-form rationale. Briefly:
        # only the firmware app binary truly differs per variant —
        # rename it to btclock_<variant>_ota.bin so the on-device
        # auto-update fetcher finds it via gitReleaseUrl. Bootloader,
        # partition-table, storage image and blank OTA state are
        # sha256-deduped: first occurrence wins under a stable name
        # ("<base>_<size>.bin" for flash-size-keyed images, plain
        # "<base>.bin" for files that hash identically across all
        # variants — typically ota_data_initial.bin).
        run: |
          set -euo pipefail
          mkdir -p release

          declare -A SIZE_FOR_VARIANT=(
            [rev-a]=4mb [rev-a-29]=4mb [rev-b]=8mb [v8]=16mb
          )
          declare -A SEEN_HASH

          for d in incoming/btclock_v4-*; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            variant="${name#btclock_v4-}"
            variant="${variant%-*}"
            variant_us="${variant//-/_}"
            size="${SIZE_FOR_VARIANT[$variant]:-unknown}"

            if [ -f "$d/btclock_v4.bin" ]; then
              cp "$d/btclock_v4.bin" "release/btclock_${variant_us}_ota.bin"
            fi

            for fname in bootloader partition-table storage ota_data_initial; do
              src="$d/${fname}.bin"
              [ -f "$src" ] || continue
              h=$(sha256sum "$src" | awk '{print $1}')
              if [ -z "${SEEN_HASH[$h]:-}" ]; then
                if [ "$fname" = "ota_data_initial" ]; then
                  out="ota_data_initial.bin"
                else
                  out="${fname}_${size}.bin"
                fi
                cp "$src" "release/${out}"
                SEEN_HASH[$h]="$out"
              fi
            done
          done

          ( cd release
            for f in *.bin; do
              sha256sum "$f" > "${f}.sha256"
            done
          )
          ls -la release

      - name: Generate combined release manifest
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          fragments=()
          for d in incoming/btclock_v4-*; do
            f="$d/manifest-fragment.json"
            [ -f "$f" ] && fragments+=("$f")
          done
          if [ ${#fragments[@]} -eq 0 ]; then
            echo "no manifest fragments found — firmware job didn't emit them?" >&2
            exit 1
          fi
          jq -n \
            --arg release_tag "$TAG" \
            --arg repository "$REPO" \
            --arg server_url "$SERVER" \
            --arg generated_at "$(date -u +%FT%TZ)" \
            --argjson variants "$(jq -s '.' "${fragments[@]}")" \
            '{release_tag: $release_tag, repository: $repository,
              server_url: $server_url, generated_at: $generated_at,
              variants: $variants}' \
            > release/manifest.json
          ( cd release && sha256sum manifest.json > manifest.json.sha256 )
          cat release/manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: release/*
          retention-days: 90

      - name: Create GitHub release and attach assets
        if: startsWith(github.ref, 'refs/tags/')
        # ncipollo/release-action over softprops/action-gh-release for
        # the `removeArtifacts: true` flag — a re-run of the same tag
        # clears the previous asset set instead of stacking duplicates.
        # GITHUB_TOKEN auto-injected by the runner via the
        # `contents: write` permission block above. Mirrors the
        # proven-working v3 GitHub CI in btclock_v3_fci.
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: "release/*.bin,release/*.sha256,release/manifest.json"
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
