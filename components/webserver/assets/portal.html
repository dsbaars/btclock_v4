<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>BTClock · Setup</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-2: #11141b;
    --card: #161a22;
    --card-2: #0d1017;
    --fg: #f3f4f6;
    --muted: #8a93a6;
    --accent: #f7931a;
    --accent-2: #ffb04d;
    --border: #242937;
    --border-2: #1b1f2a;
    --error: #f87171;
    --success: #34d399;
    --radius: 14px;
    --shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f8;
      --bg-2: #eceef2;
      --card: #ffffff;
      --card-2: #f2f4f8;
      --fg: #0b0d12;
      --muted: #4b5563;
      --border: #dfe3ea;
      --border-2: #e8ebf1;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
  }
  *,*::before,*::after { box-sizing: border-box; }
  html,body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(247,147,26,0.09), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
                 Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
  }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #fff;
    display: grid; place-items: center;
    font-size: 22px; font-weight: 700;
    box-shadow: 0 6px 16px rgba(247,147,26,0.4);
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 22px 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .networks {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border-2);
    border-radius: 10px;
    padding: 4px;
    background: var(--card-2);
  }
  .networks::-webkit-scrollbar { width: 6px; }
  .networks::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .net {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: background-color 0.12s, border-color 0.12s;
    border: 1px solid transparent;
  }
  .net:hover { background: var(--card); }
  .net.selected {
    border-color: rgba(247,147,26,0.6);
    background: rgba(247,147,26,0.08);
  }
  .net .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net .lock { color: var(--muted); font-size: 12px; }
  .net.empty { color: var(--muted); font-style: italic; padding: 16px 12px; cursor: default; }
  .bars { width: 22px; display: flex; gap: 2px; align-items: end; height: 16px; }
  .bars span { flex: 1; background: var(--border); border-radius: 1px; }
  .bars .on { background: var(--muted); }
  .bars .high { background: var(--accent); }
  .rescan {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    padding: 2px 6px;
    font-weight: 600;
  }
  .rescan:hover { color: var(--accent-2); }
  .field { margin-top: 14px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .input-wrap { position: relative; }
  input {
    width: 100%;
    background: var(--card-2);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font: inherit;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  input:focus {
    outline: none;
    border-color: rgba(247,147,26,0.7);
    box-shadow: 0 0 0 3px rgba(247,147,26,0.15);
  }
  .reveal {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
  }
  .reveal:hover { color: var(--fg); }
  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    color: #fff;
    border: none;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(247,147,26,0.3);
    transition: transform 0.08s, box-shadow 0.12s, opacity 0.12s;
  }
  button.primary:hover { box-shadow: 0 6px 18px rgba(247,147,26,0.4); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: 0.6; cursor: wait; box-shadow: none; }
  .status {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
    border: 1px solid transparent;
  }
  .status.show { display: block; }
  .status.success {
    color: var(--success);
    background: rgba(52,211,153,0.08);
    border-color: rgba(52,211,153,0.25);
  }
  .status.error {
    color: var(--error);
    background: rgba(248,113,113,0.08);
    border-color: rgba(248,113,113,0.25);
  }
  footer { margin-top: 20px; text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div class="mark">₿</div>
    <div>
      <h1>BTClock</h1>
      <p class="subtitle">Connect to your WiFi network</p>
    </div>
  </header>

  <div class="section-label">
    <span>Available networks</span>
    <button type="button" class="rescan" id="rescan">Rescan</button>
  </div>
  <div class="networks" id="networks">
    <div class="net empty">Scanning…</div>
  </div>

  <form id="form" autocomplete="off">
    <div class="field">
      <label for="ssid">Network name</label>
      <input id="ssid" name="ssid" required autocapitalize="off" spellcheck="false">
    </div>

    <div class="field">
      <label for="pw">Password</label>
      <div class="input-wrap">
        <input id="pw" name="pw" type="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" data-1p-ignore>
        <button type="button" class="reveal" id="reveal">Show</button>
      </div>
    </div>

    <button type="submit" class="primary" id="save">Save and connect</button>
    <div id="status" class="status"></div>
  </form>

  <footer>
    BTClock · ESP-IDF C++ PoC<br>
    <span id="version" class="muted"></span>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const networksEl = $('networks');
const ssidInput = $('ssid');
const pwInput = $('pw');
const statusEl = $('status');

function bars(rssi) {
  // -50 great (4), -60 good (3), -70 fair (2), -80 weak (1)
  let n = 1;
  if (rssi >= -50) n = 4;
  else if (rssi >= -60) n = 3;
  else if (rssi >= -70) n = 2;
  const heights = [4, 8, 12, 16];
  let html = '<div class="bars">';
  for (let i = 0; i < 4; i++) {
    const cls = i < n ? (n === 4 ? 'high' : 'on') : '';
    html += `<span class="${cls}" style="height:${heights[i]}px"></span>`;
  }
  return html + '</div>';
}

function render(nets) {
  if (!nets || nets.length === 0) {
    networksEl.innerHTML = '<div class="net empty">No networks found</div>';
    return;
  }
  networksEl.innerHTML = '';
  nets.forEach(n => {
    const el = document.createElement('div');
    el.className = 'net';
    el.innerHTML =
      bars(n.rssi) +
      '<span class="name"></span>' +
      (n.secured ? '<span class="lock">🔒</span>' : '');
    el.querySelector('.name').textContent = n.ssid;
    el.addEventListener('click', () => {
      document.querySelectorAll('.net.selected').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      ssidInput.value = n.ssid;
      if (n.secured) pwInput.focus(); else $('save').focus();
    });
    networksEl.appendChild(el);
  });
}

let scanRetryTimer = null;

async function scan() {
  if (scanRetryTimer) { clearTimeout(scanRetryTimer); scanRetryTimer = null; }
  networksEl.innerHTML = '<div class="net empty">Scanning…</div>';
  try {
    const r = await fetch('/api/scan');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    // Server may return the legacy bare-array form or {ready, scan}.
    const ready = Array.isArray(data) ? true : !!data.ready;
    const nets = Array.isArray(data) ? data : (data.scan || []);
    // Normalise the `secure`/`secured` field — backend emits `secure`,
    // renderer expects `secured`.
    nets.forEach(n => { if (n.secure !== undefined && n.secured === undefined) n.secured = n.secure; });
    if (!ready) {
      networksEl.innerHTML = '<div class="net empty">Scanning…</div>';
      scanRetryTimer = setTimeout(scan, 2000);
      return;
    }
    render(nets);
  } catch (e) {
    networksEl.innerHTML = '<div class="net empty" style="color:var(--error)">Scan failed</div>';
  }
}

$('rescan').addEventListener('click', scan);
$('reveal').addEventListener('click', (e) => {
  const showing = pwInput.type === 'text';
  pwInput.type = showing ? 'password' : 'text';
  e.target.textContent = showing ? 'Show' : 'Hide';
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const save = $('save');
  save.disabled = true;
  save.textContent = 'Saving…';
  statusEl.className = 'status';
  try {
    const body = new URLSearchParams({ ssid: ssidInput.value, pw: pwInput.value });
    const r = await fetch('/api/wifi', { method: 'POST', body });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    statusEl.className = 'status show success';
    statusEl.textContent =
      'Saved. The BTClock is rebooting — reconnect your device to your home WiFi and the clock should be online in a few seconds.';
  } catch (e) {
    statusEl.className = 'status show error';
    statusEl.textContent = 'Save failed: ' + e.message;
    save.disabled = false;
    save.textContent = 'Save and connect';
  }
});

scan();

(async () => {
  try {
    const r = await fetch('/api/version');
    if (!r.ok) return;
    const v = await r.json();
    const line = [v.hw, v.version, v.built].filter(Boolean).join(' · ');
    if (line) $('version').textContent = line;
  } catch (_) { /* footer stays blank */ }
})();
</script>
</body>
</html>
