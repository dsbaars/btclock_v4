# 3proxy config for btclock proxy_transport testing.
#
# Two stacks side by side:
#   - "open" stack (1080 SOCKS, 3128 HTTP CONNECT) — no auth, anyone
#     who can reach the listener gets through. Fine for localhost.
#   - "auth" stack (1081 SOCKS5 user/pass, 3129 HTTP Basic) — exercises
#     the auth code paths in the device.
#
# The `flush` between the two stacks resets the access list so the
# `auth strong` block doesn't accidentally inherit `allow * * * *`.

# DNS resolver used when the client asks the proxy to resolve a name
# (SOCKS5 ATYP=domain, SOCKS4a, HTTP CONNECT host). 127.0.0.11 is
# Docker's embedded DNS — it forwards to whatever resolver the host
# is configured with, which is what we want on networks where
# outbound UDP/53 to public resolvers is blocked (corporate / VPN).
nserver 127.0.0.11
nscache 65536

timeouts 1 5 30 60 180 1800 15 60

# Log to /logs (a tmpfs in compose) with daily rotation. Tail with:
#   docker exec btclock_proxy_test cat /logs/3proxy-$(date +%y%m%d).log
log /logs/3proxy-%y%m%d.log D
logformat "L%C %U %Y-%m-%d %H:%M:%S %N.%p %E %T %P %hu %R:%r %I %O"
rotate 3

# ---- Stack 1: anonymous SOCKS (1080) and HTTP CONNECT (3128). --------
auth iponly
allow * * * *
socks -p1080
proxy -p3128

# ---- Stack 2: authenticated SOCKS5 (1081) and HTTP Basic (3129). -----
flush
auth strong
# CL = cleartext password storage. Fine for a local test rig — DO NOT
# copy this scheme to anything internet-facing.
users testuser:CL:testpass
allow testuser
socks -p1081
proxy -p3129
